[package]
name = "fast-vrifa-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "fast-vrifa"
path = "src/main.rs"

[[bench]]
name = "perf_gate"
harness = false

[features]
default = []
cuda = ["dep:fast-vrifa-cuda"]
wgpu = ["dep:fast-vrifa-wgpu"]

[dependencies]
anyhow.workspace = true
fast-vrifa-core = { path = "../fast-vrifa-core" }
fast-vrifa-cuda = { path = "../fast-vrifa-cuda", optional = true }
fast-vrifa-wgpu = { path = "../fast-vrifa-wgpu", optional = true }
vrifa-cli.workspace = true

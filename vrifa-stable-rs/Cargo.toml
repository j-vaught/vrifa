[workspace]
members = [
    "crates/vrifa-stable-core",
    "crates/vrifa-stable-io",
    "crates/vrifa-stable-annotations",
    "crates/vrifa-stable-cli",
    "crates/vrifa-stable-py",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/j-vaught/vrifa"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
indexmap = { version = "2", features = ["serde"] }
ndarray = { version = "0.17", features = ["rayon", "serde"] }
ndarray-npy = "0.10"
numpy = "0.28"
opencv = { version = "0.98.2", default-features = false, features = ["clang-runtime"] }
pyo3 = { version = "0.28", features = ["extension-module"] }
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = "thin"
